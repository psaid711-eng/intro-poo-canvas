<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/icon2d.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Intro Canvas 2D</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand fw-bold">Canvas 2D</span>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <main class="container py-4 flex-grow-1">

        <div class="text-center mb-4">
            <h1 class="fw-bold">Objetos 2D mediante POO</h1>
            <p class="text-muted">Ejemplo de programación orientada a objetos con Canvas</p>
        </div>

        <div class="row g-4">

            <!-- Canvas 1 -->
            <div class="col-md-4">
                <div class="card shadow h-100 text-center">
                    <div class="card-header fw-bold">
                        Objeto 2D
                    </div>

                    <div class="card-body d-flex justify-content-center align-items-center">
                        <canvas class="border rounded shadow-sm" id="canvasOOP"></canvas>
                    </div>
                </div>
            </div>

            <!-- Canvas 2 -->
            <div class="col-md-4">
                <div class="card shadow h-100 text-center">
                    <div class="card-header fw-bold">
                        Objeto Random
                    </div>

                    <div class="card-body d-flex justify-content-center align-items-center">
                        <canvas class="border rounded shadow-sm" id="canvasRandom"></canvas>
                    </div>
                </div>
            </div>

            <!-- Canvas 3 -->
            <div class="col-md-4">
                <div class="card shadow h-100 text-center">
                    <div class="card-header fw-bold">
                        Múltiples Objetos
                    </div>

                    <div class="card-body d-flex justify-content-center align-items-center">
                        <canvas class="border rounded shadow-sm" id="canvasMultiple"></canvas>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>Hola  <strong>Said</strong></small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>

</body>
</html>
