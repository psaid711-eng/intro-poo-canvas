<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/icon2d.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Intro Canvas 2D</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Proyecto Canvas 2D</span>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container flex-column mt-3 shadow rounded-3 p-3 flex-grow-1">

        <div class="d-flex justify-content-center flex-row mb-3">
            <h1>Objetos 2D mediante OOP</h1>
        </div>

        <div class="d-flex flex-row shadow-sm mb-1 p-3 justify-content-around">

            <div class="d-flex justify-content-center flex-column mb-3">
                <h5 class="d-flex justify-content-center">Objeto 2D</h5>
                <canvas class="border shadow" id="canvasOOP"></canvas>
            </div>

            <div class="d-flex justify-content-center flex-column mb-3">
                <h5 class="d-flex justify-content-center">Objeto con Random</h5>
                <canvas class="border shadow" id="canvasRandom"></canvas>
            </div>

            <div class="d-flex justify-content-center flex-column mb-3">
                <h5 class="d-flex justify-content-center">Múltiples objetos</h5>
                <canvas class="border shadow" id="canvasMultiple"></canvas>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">Hola<strong>Said</strong></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>

</body>
</html>
